[package]
name = "defuss-semantic-compress-eval"
version = "0.1.0"
edition = "2021"
publish = false
description = "LLM effect safety harness for defuss-semantic-compress"
license = "MIT"

[[bin]]
name = "defuss-semantic-compress-eval"
path = "src/main.rs"

[dependencies]
defuss-semantic-compress = { path = "../defuss-semantic-compress" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
