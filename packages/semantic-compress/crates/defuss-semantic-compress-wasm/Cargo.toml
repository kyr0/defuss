[package]
name = "defuss-semantic-compress-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "WASM bindings for defuss-semantic-compress"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
defuss-semantic-compress = { path = "../defuss-semantic-compress" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
